name: Sync Fork with Upstream

on:
  schedule:
    - cron: '0 4 * * *'  # Daily at 4:00 AM UTC
  workflow_dispatch:      # Allow manual trigger

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Backup app-icon folder
        run: |
          cp -r app-icon /tmp/app-icon-backup || true

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/lldpd/lldpd.git || true
          git fetch upstream

      - name: Merge upstream into master
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git merge upstream/master --no-edit || true

      - name: Restore app-icon folder
        run: |
          rm -rf app-icon
          cp -r /tmp/app-icon-backup app-icon || true
          git add app-icon/
          git diff --cached --quiet || git commit -m "chore: restore app-icon after upstream sync"

      - name: Push to fork
        run: git push origin master
